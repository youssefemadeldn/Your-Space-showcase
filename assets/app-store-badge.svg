<svg width="460" height="120" viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Download Your Space on the App Store">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AA8FF"/>
      <stop offset="1" stop-color="#0A63D6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="btn"><rect x="16" y="16" width="428" height="88" rx="24"/></clipPath>
  </defs>

  <!-- light ON/OFF: pulsing outer glow -->
  <rect x="16" y="16" width="428" height="88" rx="24" fill="#3DB6FF" filter="url(#glow)" opacity="0.15">
    <animate attributeName="opacity" values="0.12;1;0.12" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- button body -->
  <rect x="16" y="16" width="428" height="88" rx="24" fill="url(#bg)"/>

  <!-- blinking border -->
  <rect x="17" y="17" width="426" height="86" rx="23" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.35">
    <animate attributeName="opacity" values="0.25;1;0.25" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- moving light sweep -->
  <g clip-path="url(#btn)">
    <rect x="-90" y="0" width="60" height="120" fill="#ffffff" opacity="0.28" transform="skewX(-20)">
      <animate attributeName="x" values="-90;520" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Apple logo -->
  <g transform="translate(40,24) scale(3)" fill="#ffffff">
    <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
  </g>

  <!-- text -->
  <text x="128" y="50" font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#ffffff" opacity="0.92">Download on the</text>
  <text x="126" y="88" font-family="Verdana, Geneva, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">App Store</text>

  <!-- nudging arrow -->
  <path d="M392 46 L412 60 L392 74" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="1.1s" repeatCount="indefinite"/>
  </path>
</svg>
